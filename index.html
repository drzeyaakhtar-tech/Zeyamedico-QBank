<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZeyaMedico QBank</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f7f8fc;
 color:#172554;
}
header{
 background:linear-gradient(135deg,#172554,#db2777);
 color:white;
 text-align:center;
 padding:25px 15px;
}
header h1{margin:0;font-size:28px}
header p{margin:8px 0 0}
.container{
 max-width:700px;
 margin:auto;
 padding:18px;
}
.card{
 background:white;
 border-radius:18px;
 padding:20px;
 margin:14px 0;
 box-shadow:0 4px 15px #00000012;
}
.subjects{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}
.subject{
 border:2px solid #e5e7eb;
 background:white;
 border-radius:14px;
 padding:16px 8px;
 font-size:15px;
 font-weight:bold;
 color:#172554;
}
.subject:active{transform:scale(.97)}
.question{
 font-size:19px;
 font-weight:bold;
 line-height:1.5;
}
.option{
 display:block;
 width:100%;
 text-align:left;
 padding:15px;
 margin:10px 0;
 border:2px solid #e5e7eb;
 background:white;
 border-radius:12px;
 font-size:16px;
}
.option:hover{background:#fdf2f8}
.correct{
 background:#dcfce7!important;
 border-color:#16a34a!important;
}
.wrong{
 background:#fee2e2!important;
 border-color:#dc2626!important;
}
.explanation{
 margin-top:18px;
 padding:16px;
 background:#fff7ed;
 border-left:5px solid #f97316;
 border-radius:10px;
 line-height:1.5;
}
button.next{
 width:100%;
 padding:15px;
 border:0;
 border-radius:12px;
 background:#172554;
 color:white;
 font-size:17px;
 font-weight:bold;
 margin-top:15px;
}
.back{
 background:#64748b!important;
}
.progress{
 height:8px;
 background:#e5e7eb;
 border-radius:10px;
 overflow:hidden;
 margin:15px 0;
}
.progressbar{
 height:100%;
 background:#db2777;
 width:0%;
}
.score{
 text-align:center;
 font-size:28px;
 font-weight:bold;
 color:#db2777;
}
.hidden{display:none}
.badge{
 display:inline-block;
 background:#fce7f3;
 color:#be185d;
 padding:6px 10px;
 border-radius:20px;
 font-size:13px;
 font-weight:bold;
}
footer{
 text-align:center;
 padding:25px;
 color:#64748b;
}
</style>
</head>

<body>

<header>
<h1>🩺 ZeyaMedico</h1>
<p>EXAM READY QBank</p>
<p>NEET-PG • FMGE • MBBS</p>
</header>

<div class="container">

<!-- SUBJECT PAGE -->
<section id="home">
<div class="card">
<h2>🧠 Choose Your Subject</h2>
<p>Select a subject and start solving MCQs.</p>

<div class="subjects" id="subjectList"></div>
</div>
</section>

<!-- QUIZ PAGE -->
<section id="quiz" class="hidden">

<div class="card">

<span class="badge" id="subjectName"></span>

<h3 id="questionNumber"></h3>

<div class="progress">
<div class="progressbar" id="progress"></div>
</div>

<div class="question" id="question"></div>

<div id="options"></div>

<div id="result"></div>

<button class="next hidden" id="nextBtn" onclick="nextQuestion()">
NEXT QUESTION →
</button>

</div>

<button class="next back" onclick="goHome()">← BACK TO SUBJECTS</button>

</section>

<!-- SCORE PAGE -->
<section id="scorePage" class="hidden">

<div class="card">

<h2>🎯 TEST COMPLETE</h2>

<div class="score" id="score"></div>

<p id="scoreText" style="text-align:center"></p>

<button class="next" onclick="restart()">TRY AGAIN 🔄</button>

<button class="next back" onclick="goHome()">CHOOSE ANOTHER SUBJECT</button>

</div>

</section>

</div>

<footer>
<b>ZeyaMedico</b><br>
Simplifying Med Life 🧠
</footer>


<script>

const subjects = {

"Anatomy":[
{
q:"The nerve most commonly injured during thyroid surgery is:",
o:["Vagus nerve","Recurrent laryngeal nerve","Phrenic nerve","Hypoglossal nerve"],
a:1,
e:"The recurrent laryngeal nerve runs close to the inferior thyroid artery and is at risk during thyroid surgery."
}
],

"Physiology":[
{
q:"The pacemaker of the normal heart is:",
o:["AV node","SA node","Bundle of His","Purkinje fibers"],
a:0,
e:"The sinoatrial (SA) node is the normal pacemaker because it has the highest rate of spontaneous depolarization."
}
],

"Biochemistry":[
{
q:"Which vitamin is required for hydroxylation of proline and lysine during collagen synthesis?",
o:["Vitamin A","Vitamin B12","Vitamin C","Vitamin D"],
a:2,
e:"Vitamin C is required for hydroxylation of proline and lysine in collagen synthesis."
}
],

"Pathology":[
{
q:"Pseudopalisading necrosis is classically seen in:",
o:["Meningioma","Glioblastoma","Schwannoma","Oligodendroglioma"],
a:1,
e:"Glioblastoma classically shows pseudopalisading necrosis and microvascular proliferation."
}
],

"Pharmacology":[
{
q:"Which drug is a selective beta-1 blocker?",
o:["Propranolol","Atenolol","Carvedilol","Labetalol"],
a:1,
e:"Atenolol is a relatively selective β1 blocker."
}
],

"Microbiology":[
{
q:"The most common cause of community-acquired pneumonia is:",
o:["Staphylococcus aureus","Streptococcus pneumoniae","Klebsiella","Pseudomonas"],
a:1,
e:"Streptococcus pneumoniae is the classic most common bacterial cause of community-acquired pneumonia."
}
],

"PSM":[
{
q:"The most sensitive indicator of a screening test is:",
o:["Specificity","Sensitivity","PPV","NPV"],
a:1,
e:"Sensitivity is the ability of a test to correctly identify people who have the disease."
}
],

"Medicine":[
{
q:"The most common cause of nephrotic syndrome in children is:",
o:["FSGS","Minimal change disease","Membranous nephropathy","Diabetic nephropathy"],
a:1,
e:"Minimal change disease is the classic most common cause of nephrotic syndrome in children."
}
],

"Surgery":[
{
q:"The most common cause of acute appendicitis is:",
o:["Fecolith","Parasites","Tumor","Trauma"],
a:0,
e:"Luminal obstruction, commonly by a fecolith, is a classic cause of acute appendicitis."
}
],

"Obstetrics":[
{
q:"The most common cause of postpartum hemorrhage is:",
o:["Trauma","Retained placenta","Uterine atony","Coagulopathy"],
a:2,
e:"Uterine atony is the most common cause of primary postpartum hemorrhage."
}
],

"Gynecology":[
{
q:"The most common site of ectopic pregnancy is:",
o:["Isthmus","Ampulla","Fimbria","Cervix"],
a:1,
e:"The ampulla of the fallopian tube is the most common site of ectopic pregnancy."
}
],

"Pediatrics":[
{
q:"The most common cause of bronchiolitis is:",
o:["RSV","Influenza","Adenovirus","Rhinovirus"],
a:0,
e:"Respiratory syncytial virus (RSV) is the classic most common cause of bronchiolitis."
}
],

"Ophthalmology":[
{
q:"The most common cause of reversible blindness worldwide is:",
o:["Glaucoma","Cataract","Retinal detachment","Optic neuritis"],
a:1,
e:"Cataract is a major and commonly reversible cause of blindness because vision can be restored surgically."
}
],

"ENT":[
{
q:"The most common site of epistaxis in children is:",
o:["Woodruff plexus","Kiesselbach plexus","Sphenopalatine artery","Internal carotid artery"],
a:1,
e:"Kiesselbach's plexus (Little's area) is the commonest site of anterior epistaxis."
}
],

"Orthopedics":[
{
q:"The most common site of osteosarcoma is:",
o:["Proximal humerus","Distal femur","Vertebra","Radius"],
a:1,
e:"Osteosarcoma classically occurs in the metaphysis around the knee, especially the distal femur."
}
],

"Dermatology":[
{
q:"The most common cause of tinea corporis is:",
o:["Trichophyton","Candida","Malassezia","Microsporum only"],
a:0,
e:"Dermatophytes, especially Trichophyton species, commonly cause tinea corporis."
}
],

"Psychiatry":[
{
q:"The first-line treatment for panic disorder is generally:",
o:["SSRI","Lithium","Haloperidol","ECT"],
a:0,
e:"SSRIs are commonly used as first-line long-term pharmacotherapy for panic disorder."
}
],

"Radiology":[
{
q:"The investigation of choice for suspected acute intracranial hemorrhage is:",
o:["MRI","Non-contrast CT","Ultrasound","PET"],
a:1,
e:"Non-contrast CT is rapid and highly sensitive for acute intracranial hemorrhage."
}
],

"Forensic Medicine":[
{
q:"The most reliable sign of death is:",
o:["Cessation of breathing","Cessation of heartbeat","Putrefaction","Loss of consciousness"],
a:2,
e:"Putrefaction is an unequivocal sign of death, whereas cessation of breathing or heartbeat may be reversible."
}
]

};


const subjectIcons={
"Anatomy":"🦴",
"Physiology":"❤️",
"Biochemistry":"🧪",
"Pathology":"🔬",
"Pharmacology":"💊",
"Microbiology":"🦠",
"PSM":"🌍",
"Medicine":"🩺",
"Surgery":"🔪",
"Obstetrics":"🤰",
"Gynecology":"🌸",
"Pediatrics":"👶",
"Ophthalmology":"👁️",
"ENT":"👂",
"Orthopedics":"🦴",
"Dermatology":"🧴",
"Psychiatry":"🧠",
"Radiology":"🩻",
"Forensic Medicine":"⚖️"
};

const subjectList=document.getElementById("subjectList");

Object.keys(subjects).forEach(subject=>{
let btn=document.createElement("button");
btn.className="subject";
btn.innerHTML=subjectIcons[subject]+"<br>"+subject;
btn.onclick=()=>startQuiz(subject);
subjectList.appendChild(btn);
});

let currentSubject="";
let currentQuestion=0;
let score=0;

function startQuiz(subject){

currentSubject=subject;
currentQuestion=0;
score=0;

document.getElementById("home").classList.add("hidden");
document.getElementById("scorePage").classList.add("hidden");
document.getElementById("quiz").classList.remove("hidden");

document.getElementById("subjectName").innerText=subject;

showQuestion();
}

function showQuestion(){

let data=subjects[currentSubject][currentQuestion];

document.getElementById("questionNumber").innerText=
"Question "+(currentQuestion+1)+" / "+subjects[currentSubject].length;

document.getElementById("progress").style.width=
((currentQuestion+1)/subjects[currentSubject].length*100)+"%";

document.getElementById("question").innerText=data.q;

let options=document.getElementById("options");
options.innerHTML="";

document.getElementById("result").innerHTML="";

document.getElementById("nextBtn").classList.add("hidden");

data.o.forEach((option,index)=>{

let button=document.createElement("button");

button.className="option";
button.innerText=String.fromCharCode(65+index)+". "+option;

button.onclick=()=>checkAnswer(index,button);

options.appendChild(button);

});

}

function checkAnswer(selected,button){

let data=subjects[currentSubject][currentQuestion];

let all=document.querySelectorAll(".option");

all.forEach(x=>x.disabled=true);

if(selected===data.a){

button.classList.add("correct");
score++;

document.getElementById("result").innerHTML=
'<div class="explanation"><b>🟢 CORRECT!</b><br><br>'+data.e+'</div>';

}else{

button.classList.add("wrong");

all[data.a].classList.add("correct");

document.getElementById("result").innerHTML=
'<div class="explanation"><b>🔴 INCORRECT</b><br><br><b>Correct answer: '+String.fromCharCode(65+data.a)+'</b><br><br>'+data.e+'</div>';

}

document.getElementById("nextBtn").classList.remove("hidden");

}

function nextQuestion(){

if(currentQuestion<subjects[currentSubject].length-1){

currentQuestion++;
showQuestion();

}else{

showScore();

}

}

function showScore(){

document.getElementById("quiz").classList.add("hidden");
document.getElementById("scorePage").classList.remove("hidden");

let total=subjects[currentSubject].length;

document.getElementById("score").innerText=
score+" / "+total;

document.getElementById("scoreText").innerText=
"Excellent! Keep learning with ZeyaMedico 🧠";

}

function restart(){

startQuiz(currentSubject);

}

function goHome(){

document.getElementById("quiz").classList.add("hidden");
document.getElementById("scorePage").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");

}

</script>

</body>
</html>
