"],"answer":"B","explanation":"Burkitt lymphoma is a high-grade B-cell lymphoma classically associated with jaw involvement in endemic disease."},{"id":12,"subject":"Medicine","topic":"HIV Enzymes","question":"Which HIV enzyme converts viral RNA into DNA?","options":["Integrase","RNA polymerase","Reverse transcriptase","Protease"],"answer":"C","explanation":"Reverse transcriptase synthesizes DNA from the viral RNA template."},{"id":13,"subject":"Medicine","topic":"HIV Enzymes","question":"Which HIV enzyme integrates viral DNA into the host genome?","options":["Reverse transcriptase","Integrase","Protease","Neuraminidase"],"answer":"B","explanation":"Integrase inserts viral DNA into the host cell genome."},{"id":14,"subject":"Medicine","topic":"Antiretroviral Therapy","question":"Which class of antiretroviral drugs directly inhibits the HIV enzyme responsible for viral protein cleavage?","options":["NNRTIs","NRTIs","Integrase inhibitors","Protease inhibitors"],"answer":"D","explanation":"Protease inhibitors block HIV protease and prevent maturation of viral proteins."},{"id":15,"subject":"Medicine","topic":"Antiretroviral Therapy","question":"Which class of drug blocks HIV entry by antagonizing the CCR5 co-receptor?","options":["Protease inhibitors","Integrase inhibitors","Fusion inhibitors","CCR5 antagonists"],"answer":"D","explanation":"CCR5 antagonists prevent entry of CCR5-tropic HIV into susceptible cells."}];let i=0,done={};
